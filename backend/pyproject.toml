[project]
name = "backend"
version = "0.1.0"
description = "API for openmatchroom"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "OpenMatchroom contributors" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "dj-rest-auth==7.2.0",
  "django==6.0.6",
  "django-cors-headers==4.9.0",
  "django-environ==0.13.0",
  "django-filter==25.2",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "djangorestframework==3.17.1",
  "djangorestframework-camel-case==1.4.2",
  "djangorestframework-simplejwt==5.5.1",
  "drf-spectacular==0.29.0",
  "gunicorn==26.0.0",
  "hiredis==3.4.0",
  "pillow==12.2.0",
  "psycopg[c]==3.3.4",
  "python-slugify==8.0.4",
  "redis==8.0.0",
  "sentry-sdk==2.62.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.14.1",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==6.3.0",
  "django-extensions==4.1",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "pre-commit==4.6.0",
  "psycopg[c]==3.3.4",
  "pytest==9.0.3",
  "pytest-django==4.12.0",
  "pytest-sugar==1.1.1",
  "ruff==0.15.16",
  "watchfiles==1.2.0",
  "werkzeug[watchdog]==3.1.8",
]

# ==== ruff ====
[tool.ruff]
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]

lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812", # trailing-comma rule conflicts with the formatter; let the formatter own commas
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true
# Tests assert against literal expected values; the magic-value check is only noise there.
lint.per-file-ignores = { "**/tests/**" = [ "PLR2004" ] }

# ==== pytest ====
[tool.pytest.ini_options]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
source = [ "src" ]
omit = [ "*/migrations/*", "*/tests/*", "*/templates/*" ]
plugins = [ "django_coverage_plugin" ]

[tool.coverage.report]
show_missing = true
skip_covered = false
